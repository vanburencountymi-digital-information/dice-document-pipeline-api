services:
  db:
    # 18 = latest stable and Cloud SQL's current default, so local dev
    # matches the eventual production target rather than trailing it.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dice_document_pipeline
      POSTGRES_USER: dice
      POSTGRES_PASSWORD: dice
    # Postgres 18+ images manage their own versioned subdirectory under this
    # mount (e.g. /var/lib/postgresql/18/docker) — mounting at .../data like
    # pre-18 images did makes the image refuse to start.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dice -d dice_document_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Bind mount, not a named volume like postgres_data: lets you inspect
      # uploaded/remediated PDFs directly from the host (./media/remediations/...)
      # and survives `make recreate`.
      - ./media:/app/media
    env_file:
      - .env
    environment:
      # Overrides config/settings.py's defaults — only apply inside this
      # compose network, where service names resolve via Docker's DNS.
      DATABASE_URL: postgres://dice:dice@db:5432/dice_document_pipeline
      OPENDATALOADER_HYBRID_URL: http://opendataloader-hybrid:5002
    depends_on:
      db:
        condition: service_healthy
      opendataloader-hybrid:
        condition: service_started

  # ADR 0004's "--hybrid docling-fast" AI backend — see Dockerfile.opendataloader-hybrid
  # for why this is a separate image from `app`. No healthcheck: `app` only calls this
  # over HTTP during the `ocr` pipeline step, not at startup, so there's nothing to
  # gate `app` starting on — but the first real OCR request will be slow while this
  # container's first request downloads Docling's model weights.
  opendataloader-hybrid:
    build:
      context: .
      dockerfile: Dockerfile.opendataloader-hybrid
    ports:
      - "5002:5002"

volumes:
  postgres_data:
