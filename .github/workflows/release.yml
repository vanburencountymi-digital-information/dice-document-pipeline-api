# ADR 0012 — this repo's first CI workflow. Computes the next version from Conventional
# Commit messages since the last tag (see .pre-commit-config.yaml's conventional-pre-commit
# hook, which enforces that format locally before a commit can even reach this) and pushes
# a new vX.Y.Z git tag + GitHub Release. The tag is the only thing PIPELINE_VERSION is
# sourced from (see Makefile's `build` target, Dockerfile, config/settings.py) — nothing
# here writes a version string into any repo file.
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # main requires PRs for everyone, including the default GITHUB_TOKEN's
      # github-actions[bot] identity — that bot can't be added to a ruleset's bypass
      # list. This org-owned GitHub App (installed on this repo, granted Contents:
      # read/write, added to the bypass list) mints a short-lived installation token
      # instead, so checkout and the version-bump push below both authenticate as
      # the app, not the bot.
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Must come after the token step and consume it directly: checkout bakes
      # whatever token it's given into a git credential helper
      # (http.https://github.com/.extraheader), and that's what the actual `git push`
      # semantic-release runs (via GitPython) authenticates with — not just whatever
      # `github_token` is passed to the semantic-release step below.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Semantic version release
        uses: python-semantic-release/python-semantic-release@v10.6.2
        with:
          github_token: ${{ steps.generate-token.outputs.token }}
