name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # docker-compose.yml's `app` service references `env_file: .env` — gitignored, so it
      # doesn't exist in a fresh checkout. SECRET_KEY is the only setting with no default
      # (see .env.example); everything else settings.py falls back on is fine for tests.
      - name: Create minimal .env for CI
        run: echo "SECRET_KEY=ci-test-secret-key-not-for-production" > .env

      - name: Build app image
        run: docker compose build app

      - name: Start database
        run: docker compose up -d --wait db

      # The .env key above is too short for Django's key check (needs 50+ characters), so this
      # step passes a realistic throwaway one; a warning here fails the build (ADR 0032).
      - name: Check deployment settings
        run: >
          docker compose run --rm --no-deps
          -e DEBUG=False
          -e SECRET_KEY=ci-deploy-check-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKL
          app python manage.py check --deploy --fail-level WARNING

      - name: Run Django test suite
        run: docker compose run --rm --no-deps app python manage.py test --settings=config.test_settings
