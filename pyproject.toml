[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "DJ",  # flake8-django
]
ignore = [
    "E501", # line length handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["config"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "environ.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# opendataloader_pdf ships no type stubs.
module = "opendataloader_pdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pikepdf and docling are only installed inside the opendataloader-hybrid
# Docker image (requirements-opendataloader-hybrid.txt), for
# scripts/bake_docling_models.py — not part of this repo's host/pre-commit
# environment.
module = ["pikepdf.*", "docling.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# factory_boy has no type stubs, so both factories and the tests that use
# them get correctness from actually running, not from mypy.
module = "*.tests.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"
