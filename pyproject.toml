[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dice-document-pipeline"
version = "0.1.0"
description = "DICE ADA document remediation pipeline and worker package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic",
  "pdf2image",
  "pdfplumber",
  "pikepdf",
  "Pillow",
  "pypdf",
  "pytesseract",
  "python-docx",
  "openpyxl",
  "requests",
]

[project.optional-dependencies]
windows = ["pywin32"]
adobe = ["pdfservices-sdk==4.2.0", "python-dotenv"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
