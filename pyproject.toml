[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dice-document-pipeline"
version = "0.1.0"
description = "DICE ADA document remediation pipeline and worker package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic",
  "httpx",
  "pdf2image",
  "pdfplumber",
  "pikepdf",
  "Pillow",
  "pypdf",
  "PyMuPDF",
  "pytesseract",
  "python-docx",
  "python-dotenv",
  "openpyxl",
  "requests",
]

[project.optional-dependencies]
windows = ["pywin32"]
adobe = ["pdfservices-sdk==4.2.0", "python-dotenv"]
docling = ["docling>=2.0.0"]
gcs = ["google-cloud-storage>=2.0.0"]
remediation = ["opendataloader-pdf>=2.4.0"]
api = [
  "fastapi>=0.110.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29.0",
  "pydantic-settings>=2.0.0",
  "sse-starlette>=1.6.0",
]
test = ["pytest", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
