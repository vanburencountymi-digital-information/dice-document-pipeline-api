steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--tag=us-central1-docker.pkg.dev/$PROJECT_ID/dice-pipeline/dice-document-pipeline:$COMMIT_SHA'
      - '--tag=us-central1-docker.pkg.dev/$PROJECT_ID/dice-pipeline/dice-document-pipeline:latest'
      - '--cache-from=us-central1-docker.pkg.dev/$PROJECT_ID/dice-pipeline/dice-document-pipeline:latest'
      - '.'
    timeout: '1800s'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/dice-pipeline/dice-document-pipeline'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/dice-pipeline/dice-document-pipeline:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/dice-pipeline/dice-document-pipeline:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '2400s'
