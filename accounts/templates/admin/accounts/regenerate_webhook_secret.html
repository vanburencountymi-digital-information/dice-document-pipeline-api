{% extends "admin/base_site.html" %}

{% block content %}
<p>Make a new webhook secret for <strong>{{ service_account }}</strong>? The old one stops working, so whatever checks our webhooks must be updated with the new one.</p>
<form method="post">
  {% csrf_token %}
  <input type="submit" value="Yes, regenerate" class="default">
  <a href="{% url 'admin:accounts_serviceaccount_change' service_account.pk %}" class="button cancel-link">Cancel</a>
</form>
{% endblock %}
